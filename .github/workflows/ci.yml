name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5

      - name: 设置 Python 3.13
        run: uv python install 3.13

      - name: 安装依赖
        run: uv sync --dev

      - name: Ruff 代码检查
        run: uv run ruff check .

      - name: pytest 单元测试
        run: uv run pytest

  docker-build:
    name: Docker 镜像构建（不推送）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t blockusbread:ci .
