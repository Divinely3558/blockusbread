[project]
name = "blockusbread"
version = "26.11.25a"
description = "在 Docker 中解密挂载 BitLocker USB 硬盘，并通过 SFTP 共享读取"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "itsdangerous>=2.2.0",
    "cryptography>=45.0.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# basetemp 必须显式指定：默认值取 TMPDIR，而某些环境（比如 CLI 会话把 TMPDIR
# 指到 /run/user/1000 这类 784M tmpfs）会被传输测试的 big.bin 直接撑爆，测试卡死
# 且报 ENOSPC。相对路径按调用目录解析，所以在仓库根目录跑（testpaths 也是这么假设的）。
# 想回收空间：rm -rf .pytest-tmp
addopts = "-q --basetemp=.pytest-tmp"
