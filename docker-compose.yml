services:
  blockusbread:
    build:
      context: .
      dockerfile: Dockerfile
    image: blockusbread:latest
    container_name: blockusbread
    restart: unless-stopped

    # 端口：
    #   8000 管理网页（解锁/挂载/弹出）
    #   2222 SFTP 共享（sftp://主机IP:2222 访问已挂载的盘）
    # 若宿主机的 2222 被占用，可在 .env 设置 SFTP_HOST_PORT 改为其他端口
    ports:
      - "8000:8000"
      - "${SFTP_HOST_PORT:-2222}:22"

    # 读取块设备 / 执行 mount / FUSE 挂载必须特权运行
    privileged: true

    environment:
      TZ: Asia/Shanghai
      # 管理员账号（管理页登录 + SFTP 共用）
      ADMIN_USER: ${ADMIN_USER:-admin}
      # 必填：管理员密码（管理页 + SFTP 共用；改密码改这里后重建容器即可）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 或环境变量中设置 ADMIN_PASSWORD}
      # 必填：「记住此卷」凭据加密密钥（openssl rand -base64 32）；
      # 一经使用请勿更换，否则已保存凭据无法解密
      SECRET_KEY: ${SECRET_KEY:?请在 .env 或环境变量中设置 SECRET_KEY}
      # 日志级别：INFO / DEBUG
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # SFTP 宿主机映射端口（仅用于管理页展示连接地址，需与上方端口映射一致）
      SFTP_HOST_PORT: ${SFTP_HOST_PORT:-2222}

    volumes:
      # 块设备目录：支持 USB 硬盘热插拔后在容器内即时可见
      - /dev:/dev
      # udev 设备数据库：供 lsblk / blkid 正确识别设备型号与文件系统（只读）
      - /run/udev:/run/udev:ro

      # 应用数据（“记住此卷”加密凭据、远程存储配置、日志、SSH 主机密钥）
      - ./data:/app/data

      # 本地存储（可选）：把宿主机目录 bind 映射到 SFTP 根目录（/mnt/usb/<名称>），
      # 会作为“本地存储”出现在管理页，始终读写、不可弹出，目录名即存储名。
      # 不要把真实路径写进本文件（本文件会提交到仓库）！
      # 实际映射请写在 docker-compose.override.yml（已被 .gitignore 忽略）：
      #   services:
      #     blockusbread:
      #       volumes:
      #         - /你的目录:/mnt/usb/存储名
      # 支持多个映射，docker compose 会自动合并加载 override 文件。

  # 可选 HTTPS 反代（自签证书，默认不启动）：
  #   docker compose --profile tls up -d
  # 然后访问 https://<宿主机IP>:8443 ；首次打开需在浏览器手动信任证书
  caddy:
    image: caddy:2-bookworm
    container_name: blockusbread-caddy
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - blockusbread
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # 自签证书与配置持久化，重建容器不重复签发
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
