services:
  blockusbread:
    build:
      context: .
      dockerfile: Dockerfile
    image: blockusbread:latest
    container_name: blockusbread
    restart: unless-stopped

    # 端口：
    #   8000 管理网页（解锁/挂载/弹出）
    #   445  SMB 共享（\\主机IP\usb 访问已挂载的盘）
    # 若宿主机自身的 SMB 服务占用 445，可在 .env 设置 SMB_HOST_PORT（如 1445），
    # 此时 Linux/macOS/VLC 可带端口连接；Windows 资源管理器仅支持 445，需停掉宿主 SMB
    ports:
      - "8000:8000"
      - "${SMB_HOST_PORT:-445}:445"

    # 读取块设备 / 执行 mount / FUSE 挂载必须特权运行
    privileged: true

    environment:
      TZ: Asia/Shanghai
      # 管理员账号（管理页登录 + SMB 共享共用）
      ADMIN_USER: ${ADMIN_USER:-admin}
      # 必填：管理员密码（管理页 + SMB 共用；改密码改这里后重建容器即可）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 或环境变量中设置 ADMIN_PASSWORD}
      # 选填：设置后“记住此卷”才可用（凭据加密密钥），建议使用长随机串
      SECRET_KEY: ${SECRET_KEY:-}
      # 日志级别：INFO / DEBUG
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # 块设备目录：支持 USB 硬盘热插拔后在容器内即时可见
      - /dev:/dev
      # udev 设备数据库：供 lsblk / blkid 正确识别设备型号与文件系统（只读）
      - /run/udev:/run/udev:ro

      # 应用数据（“记住此卷”加密凭据、日志）
      - ./data:/app/data
